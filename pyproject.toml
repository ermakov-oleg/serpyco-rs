[build-system]
requires = ["maturin>=1,<2"]
build-backend = "maturin"

[tool.maturin]
python-source = "python"
module-name = "serpyco_rs._serpyco_rs"
# The codec (bytes) benches must stay listed: code left out of the profile is
# compiled as cold, worth -21%..-35% on the codec path.
pgo-command = 'uv sync --active --locked --group pgo --no-install-project --inexact && python -m pytest bench/test_encoders.py bench/test_codec_encoders.py bench/test_flatten.py bench/test_full.py bench/compare/test_github_issue.py bench/compare/test_github_issue_bytes.py -k "not mashumaro and not msgspec and not orjson and not ormsgpack" --benchmark-min-time=0.2 --benchmark-max-time=0.4'

[project]
name = "serpyco-rs"
dynamic = ["version"]
repository = "https://github.com/ermakov-oleg/serpyco-rs"
requires-python = ">=3.10"
license = { file = "LICENSE" }
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python",
    "Programming Language :: Rust",
]

dependencies = ["attributes-doc", "typing-extensions>=4.15.0"]

[dependency-groups]
dev = [
    "pytest",
    "coverage[toml]",
    "attrs",
    "maturin>=1.15,<2",
    "pytz",
    "python-dateutil",
    "multidict",
    "tzdata; sys_platform == 'win32'",
]
lint = [
    { include-group = "dev" },
    "ruff",
]
type_check = [
    { include-group = "dev" },
    "mypy",
    "pyright",
    "types-python-dateutil",
]
bench = [
    { include-group = "dev" },
    "pytest-benchmark[histogram]",
    "tabulate",
]
# Installed in every PGO build-matrix job (3.10 … 3.15t), so it must stay light: libs
# like orjson lack wheels for some of those interpreters and would build from source.
pgo = [
    { include-group = "bench" },
    "mashumaro",
]
codspeed = [
    { include-group = "bench-compare" },
    "pytest-codspeed",
]
bench-compare = [
    { include-group = "bench" },
    "serpyco",
    "pydantic",
    "marshmallow",
    "marshmallow-dataclass",
    "mashumaro[orjson]",
    "msgspec",
    "ormsgpack",
]
all = [
    { include-group = "dev" },
    { include-group = "lint" },
    { include-group = "type_check" },
    { include-group = "bench-compare" },
]

[tool.coverage.run]
branch = true
source = ["python/serpyco_rs"]

[tool.coverage.report]
show_missing = true
skip_covered = true
