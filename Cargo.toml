[package]
name = "serpyco-rs"
version = "1.21.0"
edition = "2021"
homepage = "https://github.com/ermakov-oleg/serpyco-rs"
repository = "https://github.com/ermakov-oleg/serpyco-rs"

[lib]
name = "serpyco_rs"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.29", features = ["extension-module", "py-clone", "num-bigint"] }
pyo3-ffi = "0.29"
speedate = "0.17.0"

dyn-clone = "1.0.20"
nohash-hasher = "0.2"
rustc-hash = "2"
smallvec = "1"

uuid = "1"

jiter = { version = "0.16", features = ["num-bigint"] }
num-bigint = "0.5"
itoa = "1"
ryu = "1"
simdutf8 = "0.1"

[build-dependencies]
pyo3-build-config = { version = "0.29", features = ["resolve-config"] }

[profile.release]
codegen-units = 1
lto = "thin"
